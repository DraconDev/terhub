[package]
name = "terhub"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "A terminal command center: every session, pane, and agent (local tmux/zellij/screen + SSH hosts) in one TUI, with which ones need you made obvious and one keystroke to jump to them."
license = "MIT"
repository = "https://github.com/DraconDev/terhub"
homepage = "https://github.com/DraconDev/terhub"
documentation = "https://github.com/DraconDev/terhub#readme"
# Local scratch/notes must never ship to crates.io: git-tracked files
# are bundled by default, so exclude each one explicitly.
exclude = [
    ".dracon/",
    ".pi-glla/",
    ".pytest_cache/",
    "assets/",
    "conversation-*.txt",
    "RESEARCH.md",
    "AUDIT.md",
    "TASKS.md",
    "note.md",
    "Cargo.toml.orig",
    "examples/",
    "Makefile",
    "scripts/",
    "deny.toml",
    ".gitattributes",
    ".github/",
    ".gitignore",
]

default-run = "terhub"
keywords = ["tmux", "tui", "agent", "session", "zellij"]
categories = ["command-line-utilities"]

[[bin]]
name = "terhub"
path = "src/main.rs"

[[bin]]
name = "terhubd"
path = "src/bin/terhubd.rs"

[lib]
name = "terhub"
path = "src/lib.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
serde_json = "1.0.151"
regex = "1.13.1"
axum = "0.8.9"
ansi-to-tui = "8.0.1"
libc = "0.2.189"
# StatusNotifierItem tray icon (`terhub tray`). Blocking API only: the
# daemon socket poll is synchronous too, so no async runtime is needed.
zbus = { version = "6", default-features = false, features = ["proxy", "service", "object-manager", "tokio"] }
