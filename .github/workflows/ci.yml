name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pin immutable SHAs (tag in the comment
      # only): a moved major tag would silently swap the code CI runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # The tmux-dependent suites fail loudly without a tmux binary
      # (see tests/backend.rs), so CI must provide one.
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Cold runners have an empty cargo registry: fetch first, or
      # every --offline gate dies at dependency resolution before
      # linting or testing anything.
      - name: fetch dependencies
        run: cargo fetch --locked
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: test
        run: cargo test --offline
      # Publishability, not publishing: proves every main commit keeps
      # the crate shippable (metadata, file list, lockfile) without
      # needing a registry token. The tag-triggered release workflow
      # re-runs this on the exact tagged commit plus a version check.
      - name: publish dry run
        run: cargo publish --dry-run
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      # The stale-binary behavioural gate (scripts/check-install.sh):
      # install once so the script has a pre-existing binary, then let
      # it prove `make build` reinstalls. The explicit --root keeps
      # this step on the same ${CARGO_HOME:-~/.cargo}/bin the script
      # checks, exactly like the Makefile install recipes.
      # See tests/install_target.rs.
      - name: install binary
        run: cargo install --path . --offline --locked --force --root "${CARGO_HOME:-$HOME/.cargo}"
      - name: check-install
        run: make check-install

  # The advertised minimum Rust version must actually build the crate.
  # Nothing else proves it: every other job runs on `stable`, so a
  # dependency that raises its own MSRV leaves CI green while the
  # users the README promises to support silently lose support.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The toolchain comes from the `with:` input, so the action's
      # pinned SHA is the same one the stable job uses.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.89.0"
      - name: fetch dependencies
        run: cargo fetch --locked
      - name: check the minimum supported Rust version
        run: cargo check --offline --all-targets
