[package]
name = "terhub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal-first session hub over tmux: mouse-friendly, customizable, non-vim."
license = "MIT"
default-run = "terhub"

[[bin]]
name = "terhub"
path = "src/main.rs"

[[bin]]
name = "terhubd"
path = "src/bin/terhubd.rs"

[lib]
name = "terhub"
path = "src/lib.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
serde_json = "1.0.151"
regex = "1.13.1"
axum = "0.8.9"
ansi-to-tui = "8.0.1"
libc = "0.2.189"
# StatusNotifierItem tray icon (`terhub tray`). Blocking API only: the
# daemon socket poll is synchronous too, so no async runtime is needed.
zbus = { version = "5", default-features = false }
